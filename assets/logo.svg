<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="50%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#818cf8"/>
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399"/>
      <stop offset="100%" style="stop-color:#6ee7b7"/>
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="20" y="20" width="160" height="160" rx="40" fill="url(#logoGrad)" filter="url(#logoGlow)"/>
  <rect x="30" y="30" width="140" height="140" rx="34" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <g transform="translate(100,100)">
    <circle cx="0" cy="0" r="45" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="3"/>
    <path d="M-20,2 L-8,16 L24,-18" fill="none" stroke="url(#checkGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <circle cx="55" cy="55" r="8" fill="rgba(255,255,255,0.1)"/>
  <circle cx="150" cy="60" r="5" fill="rgba(255,255,255,0.08)"/>
  <circle cx="50" cy="145" r="6" fill="rgba(255,255,255,0.06)"/>
</svg>
